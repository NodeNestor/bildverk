version: 2
updates:
  # NetVips.Native carries libvips and every codec: security fixes arrive through it.
  - package-ecosystem: nuget
    directories: ["/src/Bildverk", "/tests/Bildverk.Tests", "/bench/*", "/samples/*"]
    schedule:
      interval: weekly
    groups:
      all-nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns: ["*"]
