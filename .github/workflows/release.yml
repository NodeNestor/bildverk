name: Release

# Push a tag like v0.1.0 to release: build, test, pack, GitHub release with the .nupkg attached.
# Publishing to nuget.org is optional and switches on by itself once NuGet Trusted Publishing is set up
# (a policy on nuget.org trusting this repo's release.yml + the secret NUGET_USER = nuget.org username).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # create the GitHub release
  id-token: write  # OIDC token for NuGet Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Bildverk.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --project tests/Bildverk.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/Bildverk -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # Short-lived (1 h) API key from nuget.org in exchange for GitHub's OIDC token. Request it right before pushing.
      - name: NuGet login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: env.NUGET_USER != ''
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Bildverk ${{ steps.version.outputs.version }}" --notes-file notes.md
