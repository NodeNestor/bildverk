name: Release

# Push a tag like v0.1.0 to publish. Needs the repository secret NUGET_API_KEY.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Bildverk.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --project tests/Bildverk.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/Bildverk -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Bildverk ${{ steps.version.outputs.version }}" --notes-file notes.md
