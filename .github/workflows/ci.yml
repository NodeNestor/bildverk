name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (warnings are errors)
        run: dotnet build Bildverk.slnx -c Release

      - name: Test
        run: dotnet test --project tests/Bildverk.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/Bildverk -c Release --no-build -o artifacts

      - name: Vulnerable packages
        shell: bash
        run: |
          dotnet list src/Bildverk package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*
