name: Fuzz

# Mutation fuzzing of the processing path (bench/Fuzz). Fails and uploads the inputs on any finding.
# Weekly while private (Actions minutes); make it nightly ("0 2 * * *") once public.
on:
  schedule:
    - cron: "0 2 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time in seconds
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build fuzzer
        run: dotnet build bench/Fuzz -c Release

      - name: Fuzz
        run: dotnet bench/Fuzz/bin/Release/net10.0/Fuzz.dll - fuzz-out ${{ github.event.inputs.seconds || '600' }} 4 2>/dev/null

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: fuzz-out/finding-*
