name: Fuzz

# Mutation fuzzing of the processing path (bench/Fuzz). Fails and uploads the inputs on any finding.
on:
  schedule:
    - cron: "0 2 * * *" # nightly
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time in seconds
        default: "900"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build fuzzer
        run: dotnet build bench/Fuzz -c Release

      - name: Fuzz
        run: dotnet bench/Fuzz/bin/Release/net10.0/Fuzz.dll - fuzz-out ${{ github.event.inputs.seconds || '900' }} 4 2>/dev/null

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: fuzz-out/finding-*
